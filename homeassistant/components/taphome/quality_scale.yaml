rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register any custom service actions.
  appropriate-polling:
    status: done
    comment: >-
      Push based (webhook + local push). Polling is only a fallback with
      intervals matched to the connection type (2s local, 20s cloud, 60s once
      webhook push is active).
  brands: done
  common-modules:
    status: done
    comment: >-
      The shared entity base lives in entity.py. The integration is push
      based and has no update coordinator.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register any custom service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
